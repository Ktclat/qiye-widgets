name: Verify and publish widgets
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: widgets-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test without a host checkout
        run: |
          npm test
          npm run check
          python scripts/build.py
          python -m unittest discover -s tests -p 'build_test.py'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Every widget, five card sizes, both themes and narrow windows
        run: |
          python tests/runtime-e2e.py
          python tests/cache-e2e.py
          python tests/view-switch-e2e.py
          python tests/window-e2e.py
          python tests/widget-controls-e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: widgets-release
          path: dist/qiye-widgets-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgets-browser-report
          path: output/playwright
  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: widgets-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - uses: actions/download-artifact@v4
        with:
          name: widgets-release
          path: dist
      - name: Publish new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/published-tags"
          if ! grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/published-tags"; then
            gh release create "$GITHUB_REF_NAME" dist/qiye-widgets-* --verify-tag --title "Qiye Widgets $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
      - name: Preserve and build versioned public files
        run: |
          site="$RUNNER_TEMP/widgets-public"
          mkdir -p "$site"
          git -C "$site" init
          git -C "$site" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git -C "$site" fetch --depth=1 origin gh-pages
            git -C "$site" checkout -b gh-pages FETCH_HEAD
          else
            git -C "$site" checkout --orphan gh-pages
          fi
          python scripts/build.py --output "$site"
          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add -A
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" commit -m "Publish widgets $GITHUB_REF_NAME"
            git -C "$site" -c "http.https://github.com/.extraheader=$(git config --get http.https://github.com/.extraheader)" push origin HEAD:gh-pages
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/widgets-public
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
